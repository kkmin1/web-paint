<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Paint</title>
  <link rel="stylesheet" href="./style.css" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
  <div id="app">
    <header class="toolbar">
      <!-- Row 1: Tool Buttons -->
      <div class="toolbar-row">
        <button class="tool-btn active icon-tool-btn" data-tool="brush" title="연필" aria-label="연필">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 20l4.5-1 9.7-9.7-3.5-3.5L5 15.5 4 20z"></path>
            <path d="M13.7 4.3l3.5 3.5 1.5-1.5a1.8 1.8 0 0 0 0-2.6l-.9-.9a1.8 1.8 0 0 0-2.6 0l-1.5 1.5z"></path>
          </svg>
        </button>
        <button class="tool-btn icon-tool-btn" data-tool="eraser" title="지우개" aria-label="지우개">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 16.5L14.8 8.7l4.5 4.5-5.2 5.3H8.8L7 16.5z"></path>
            <path d="M4.7 14.2l7.1-7.1a2 2 0 0 1 2.8 0l.9.9-7.8 7.8-.9-.9a2 2 0 0 1 0-2.7z"></path>
            <path d="M14 18.5h6"></path>
          </svg>
        </button>
        <button class="tool-btn icon-tool-btn" data-tool="line" title="직선" aria-label="직선">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 19L19 5"></path>
            <circle cx="5" cy="19" r="1.8"></circle>
            <circle cx="19" cy="5" r="1.8"></circle>
          </svg>
        </button>
        <button class="tool-btn icon-tool-btn" data-tool="rect" title="사각형" aria-label="사각형">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="4.5" y="6" width="15" height="12" rx="1.5"></rect>
          </svg>
        </button>
        <button class="tool-btn color-select-btn icon-tool-btn" id="colorSelectBtn" title="색 선택" aria-label="색 선택">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3c-5 0-9 3.6-9 8 0 3.3 2.5 5 4.8 5H9a1.5 1.5 0 0 1 1.5 1.5c0 1.4 1.1 2.5 2.5 2.5 4.4 0 8-4 8-9s-4-8-9-8z"></path>
            <circle cx="7.5" cy="10" r="1"></circle>
            <circle cx="10" cy="7.5" r="1"></circle>
            <circle cx="14" cy="7.5" r="1"></circle>
            <circle cx="16.5" cy="10" r="1"></circle>
          </svg>
        </button>
        <button class="tool-btn icon-tool-btn" data-tool="triangle" title="삼각형" aria-label="삼각형">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5l8 14H4L12 5z"></path>
          </svg>
        </button>
        <button class="tool-btn icon-tool-btn" data-tool="ellipse" title="타원" aria-label="타원">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <ellipse cx="12" cy="12" rx="8" ry="5.5"></ellipse>
          </svg>
        </button>
        <button class="tool-btn icon-tool-btn" data-tool="text" title="텍스트" aria-label="텍스트">
          <span class="tool-text-glyph" aria-hidden="true">T</span>
        </button>
        <button class="tool-btn text-tool-btn" data-tool="select" title="영역선택" aria-label="영역선택">
          영역선택
        </button>
        <button class="action-btn" id="cropBtn" title="자르기" style="display: none;">자르기</button>
      </div>

      <!-- Row 2: Settings & Controls -->
      <div class="toolbar-row settings-row">
        <div class="control-dropdown">
          <button class="named-btn" id="sizeBtn" type="button" title="선 굵기">선굵기: 5</button>
          <div class="dropdown-menu hidden" id="sizeMenu"></div>
          <select id="sizeInput" class="named-select hidden-native-select" title="선 굵기">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5" selected>5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
            <option value="15">15</option>
            <option value="20">20</option>
          </select>
        </div>
        <div class="control-dropdown">
          <button class="named-btn" id="fontFamilyBtn" type="button" title="폰트">폰트: Arial</button>
          <div class="dropdown-menu hidden" id="fontFamilyMenu"></div>
          <select id="fontFamily" class="named-select hidden-native-select" title="폰트">
            <option value="Arial, sans-serif" selected>Arial</option>
            <option value="Inter, sans-serif">Inter</option>
            <option value="'Times New Roman', serif">Times</option>
            <option value="'Courier New', monospace">Courier</option>
            <option value="Georgia, serif">Georgia</option>
            <option value="'Brush Script MT', cursive">Brush</option>
          </select>
        </div>
        <div class="control-dropdown">
          <button class="named-btn" id="fontSizeBtn" type="button" title="폰트 크기">폰트크기: 16</button>
          <div class="dropdown-menu hidden" id="fontSizeMenu"></div>
          <select id="fontSize" class="named-select hidden-native-select" title="폰트 크기">
            <option value="8">8</option>
            <option value="10">10</option>
            <option value="12">12</option>
            <option value="14">14</option>
            <option value="16" selected>16</option>
            <option value="18">18</option>
            <option value="20">20</option>
            <option value="22">22</option>
            <option value="24">24</option>
            <option value="26">26</option>
            <option value="30">30</option>
            <option value="40">40</option>
          </select>
        </div>
        <button class="zoom-btn" id="zoomOutBtn" title="축소 (Ctrl+-)">🔍-</button>
        <button class="zoom-btn" id="zoomInBtn" title="확대 (Ctrl++)">🔍+</button>
      </div>

      <!-- Row 3: Action Buttons -->
      <div class="toolbar-row actions-row">
        <button class="action-btn load-btn" id="importBtn" title="불러오기">불러오기</button>
        <button class="action-btn undo-btn icon-action-btn" id="undoBtn" title="뒤로가기" aria-label="뒤로가기">
          <span aria-hidden="true">&larr;</span>
        </button>
        <button class="action-btn undo-btn icon-action-btn" id="redoBtn" title="앞으로 가기" aria-label="앞으로 가기">
          <span aria-hidden="true">&rarr;</span>
        </button>
        <div class="control-dropdown save-dropdown">
          <button class="action-btn save-btn" id="saveBtn" type="button" title="저장">저장</button>
          <div class="dropdown-menu hidden" id="saveMenu"></div>
        </div>
        <button class="action-btn clear-btn" id="clearBtn" title="지우기">지우기</button>
        <input type="file" id="fileInput" accept="image/*" style="display: none;">
      </div>
    </header>

    <main class="workspace">
      <div class="canvas-wrapper">
        <canvas id="canvas" width="1600" height="1200"></canvas>
        <div class="resize-handle right" id="resizeRight"></div>
        <div class="resize-handle bottom" id="resizeBottom"></div>
        <div class="resize-handle corner" id="resizeCorner"></div>
      </div>
    </main>

    <footer class="status-bar">
      <div class="status-item" id="cursorPos"></div>
      <div class="status-item" id="canvasSize">1600 x 1200px</div>
      <div class="status-item" id="zoomLevel">100%</div>
    </footer>
  </div>

  <div class="color-modal hidden" id="colorModal" aria-hidden="true">
    <div class="color-modal-backdrop" id="colorModalBackdrop"></div>
    <div class="color-modal-panel" role="dialog" aria-modal="true" aria-label="색 선택">
      <div class="color-modal-header">
        <strong>색 선택</strong>
        <button class="color-modal-close" id="colorModalClose" type="button">닫기</button>
      </div>
      <div class="color-modal-body">
        <input type="color" id="colorPicker" value="#000000" title="Color">
        <input type="text" id="colorHexInput" value="#000000" maxlength="7" spellcheck="false">
      </div>
      <div class="color-presets" id="colorPresets"></div>
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>

</html>
